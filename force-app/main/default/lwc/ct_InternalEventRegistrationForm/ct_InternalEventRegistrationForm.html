<template>
  <div data-id="topElement" id="topElem" class="topElement"></div>
  <div>
    <div class="slds-is-relative">
      <template if:true={showSpinnerBoolean}>
        <div class="slds-m-vertical--xx-large">
          <lightning-spinner alternative-text="Loading" variant="brand" size="medium"></lightning-spinner>
        </div>
      </template>

      <template if:true={showForm}>
        <template if:true={showTicketSelection}>
          <c-ct_ticket-selection-v2 oncancelcheckineventregistration={triggerEventregisteredCustomEvent} onticketselectionextevent={showOrderDetails} is-internal-component="true" is-check-in-manager-component={isCheckInManagerComponent} selected-event-id={eventRecordId} order-by={ticket_Selection_orderBy} selected-tickets={ticket_Selection_selectedTickets}></c-ct_ticket-selection-v2>
         <div class="slds-p-vertical_medium">
          <!-- <button class="uopButtonStyle slds-button slds-button_destructive"
            style="border-radius: 0px;" onclick={showOrderDetails}>Next</button> -->
         </div>
          
        </template>

        <template if:true={showEventOrderDetails}>
          <c-ct_-event-order-details-v2 oneventorderpreviousevent={handleEventOrderDetailPreviousButton} selected-event={selectedEventRec} oneventordernextevent={handleEventOrderDetailNextButton} order-by={ticket_Selection_orderBy} selected-tickets={ticket_Selection_selectedTickets} tickets={event_Order_Details_ticket} ordered-tickets={event_Order_Details_OrderedTickets} is-internal-component="true" is-backfrom-order-summary={isBackfromOrderSummary} ></c-ct_-event-order-details-v2>
        </template>

        <template if:true={showTicketOrderSummary}>
          <c-ct_ticket-order-summary-v2 data-id="ticketordersummarylwc" onordersummaryscrolltop={ticketOrderSummaryTop} oneventregistered={triggerEventregisteredCustomEvent} is-check-in-manager-component={isCheckInManagerComponent}  internal-registration-form-data={internalRegistrationFormData} onordersummarybackevent={handleTicketSummaryBackButton} tickets={event_Order_Details_ticket} ordered-by={ticket_Selection_orderBy} ordered-tickets={event_Order_Details_OrderedTickets} is-internal-component="true" ></c-ct_ticket-order-summary-v2>
        </template>

      </template>

      <template if:true={showForceCheckinStatusOption}>
        <div class="slds-p-top_x-small" style="display:flex; flex-direction: row; align-items: center">
          <lightning-input type="checkbox" checked={internalRegistrationFormData.setEventRegCheckedIn} variant="label-hidden" id="setEventRegWalkIN" name="setEventRegCheckedIn" onchange={handleInternalRegFormData} ></lightning-input>
          <label class="slds-form-element__label fieldLabelStyle" for="setEventRegWalkIN">Set Event Registrations to Checked In</label>
        </div>
      </template>
