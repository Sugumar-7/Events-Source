    <!--TICKET UNAVAILABLE-->
    <template if:true={isCancelled}>
      <div class="slds-grid slds-gutters">
        <div class="slds-col">
          <h1 class="slds-card__header-title slds-p-around_small slds-p-left_none headerFont">
            Ticket Management Unavailable
          </h1>
          <label class="slds-form-element__label fieldLabelStyle" for="eventName">Ticket Management is not currently available for this Event Ticket.</label><br>
          <label class="slds-form-element__label fieldLabelStyle" for="eventName">This may be due to the fact that the ticket has been cancelled or the event is no longer available.</label><br>
          <label class="slds-form-element__label fieldLabelStyle" for="eventName">If you believe there is an issue please visit <a href="https://www.google.com" target="_blank">https://www.google.com</a></label>
        </div>
      </div>
    </template>
    <!--TICKET UNAVAILABLE-->

    <template if:false={isCancelled}>
    <!--TICKET MANAGEMENT-->
    <template if:true={showTicketManagement}>
    <div class="slds-grid slds-gutters slds-grid_vertical">
      <template if:true={eventRegistration}>
        <div class="slds-p-vertical_medium">
          <h2 class="slds-card__header-title slds-p-horizontal_small headerFont">
            Ticket Management
          </h2>
        <div class="slds-col slds-p-around--xx-small">
          <label class="slds-form-element__label fieldLabelStyle" for="`">Event</label>
          <lightning-input type="text" id="eventName" disabled variant="label-hidden" value={eventRegistration.Event__r.Web_Event_Name__c}
                  class="inputFieldPlaceHolder" ></lightning-input>
        </div>
        <div class="slds-col slds-p-around--xx-small">
          <label class="slds-form-element__label fieldLabelStyle" for="ticketRegNo">Ticket Registration Number</label>
          <lightning-input type="text" id="ticketRegNo" disabled  variant="label-hidden" value={eventRegistration.Name}
                  class="inputFieldPlaceHolder fieldLabelStyle" ></lightning-input>
        </div>
        <div class="slds-col slds-p-around--xx-small">
          <label class="slds-form-element__label fieldLabelStyle" for="eventRegStatus">Event Registration Status</label>
          <lightning-input type="text" id="eventRegStatus" disabled  variant="label-hidden" value={eventRegistration.Event_Registration_Status__c}
                  class="inputFieldPlaceHolder fieldLabelStyle" ></lightning-input>
        </div>
        <div class="slds-col slds-p-around--xx-small">
          <label class="slds-form-element__label fieldLabelStyle" for="eventOrder">Event Order</label>
          <lightning-input type="text" id="eventOrder" disabled  variant="label-hidden" value={eventRegistration.Event_Order__r.Name}
                  class="inputFieldPlaceHolder fieldLabelStyle" ></lightning-input>
        </div>
        <div class="slds-col slds-p-around--xx-small">
          <label class="slds-form-element__label fieldLabelStyle" for="eventProduct">Event Product</label>
          <lightning-input type="text" id="eventProduct" disabled  variant="label-hidden" value={eventRegistration.Event_Product__r.Name}
                  class="inputFieldPlaceHolder fieldLabelStyle" ></lightning-input>
        </div>
      </div>
      <div class="slds-p-vertical_medium">
      <h2 class="slds-card__header-title slds-p-horizontal_small headerFont">
        Attendee Details
      </h2>
      <div class="slds-col slds-p-around--xx-small">
        <label class="slds-form-element__label fieldLabelStyle" for="regType">Registration Type</label>
        <lightning-input type="text" id="regType" disabled  variant="label-hidden" value={registrationType}
                class="inputFieldPlaceHolder fieldLabelStyle" ></lightning-input>
      </div>
      <template if:false={isNamedAttendee}>
        <div class="slds-col slds-p-around--xx-small">
          <label class="slds-form-element__label fieldLabelStyle" for="eventName">This ticket is currently for a guest. To receive event information &amp; to register for sessions please provide attendee details below.</label>
        </div>
      </template>
      <div class="slds-col slds-p-around--xx-small">
        <label class="slds-form-element__label fieldLabelStyle" for="firstName">First Name<abbr class="slds-required"
          title="required">*</abbr></label>
        <lightning-input type="text" id="firstName" name="First_Name__c"  variant="label-hidden" value={eventRegistration.First_Name__c}
                class="saveRequiredClass inputFieldPlaceHolder fieldLabelStyle" disabled={isNamedAttendee} onchange={handleValueChange} placeholder="Please enter first name" required></lightning-input>
      </div>
      <div class="slds-col slds-p-around--xx-small">
        <label class="slds-form-element__label fieldLabelStyle" for="lastName">Last Name<abbr class="slds-required"
          title="required">*</abbr></label>
        <lightning-input type="text" id="lastName" name="Last_Name__c"  variant="label-hidden" value={eventRegistration.Last_Name__c}
                class="saveRequiredClass inputFieldPlaceHolder fieldLabelStyle" disabled={isNamedAttendee} onchange={handleValueChange} placeholder="Please enter last name" required></lightning-input>
      </div>
      <div class="slds-col slds-p-around--xx-small">
        <label class="slds-form-element__label fieldLabelStyle" for="email">Email<abbr class="slds-required"
          title="required">*</abbr></label>
        <lightning-input type="text" pattern="^([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,15})$" message-when-pattern-mismatch="Please enter a valid email address" id="email" name="Event_Email__c" onblur={validateDuplicateEmail} variant="label-hidden" disabled={isNamedAttendee} value={eventRegistration.Event_Email__c}
                class="saveRequiredClass inputFieldPlaceHolder fieldLabelStyle "  data-id="emailaddressinput" onchange={handleValueChange} placeholder="Please enter email" required></lightning-input>
      </div>
      <!-- Below line is commented--because we are not getting the value from the user -->
      <!-- <div class="slds-col slds-p-around--xx-small">
        <label class="slds-form-element__label fieldLabelStyle" for="mobile">Mobile</label>
        <lightning-input type="text" pattern="[0-9-+()]*$" message-when-pattern-mismatch="Please provide a valid mobile number" max-length="11" id="mobile" name="Event_Mobile__c"  variant="label-hidden" disabled={isNamedAttendee} value={eventRegistration.Event_Mobile__c}
                class="inputFieldPlaceHolder fieldLabelStyle" onchange={handleValueChange} placeholder="Please enter mobile number"></lightning-input>
      </div> -->
      <!-- <template if:true={canRenderQuestionForm}> -->
      <template if:true={showSaveEdit}>
        <div>
          <c-ct_-event-questions-form-v2 onanswergiven={handleQuestionsAnswers} onsessionselection={handleSessionSelection} record-id={eventRegistrationId} is-disabled={isNamedAttendee} ></c-ct_-event-questions-form-v2>
        </div>
      </template>
    <!-- </template> -->
      <template if:true={showSaveEdit}>
      <div class="slds-col slds-p-around--x-small">
        <button type="button" value="Save / Edit" style="border-radius: 0px;"
                class="searchButtonStyle slds-button slds-button_success slds-float_left" onclick={handleSave}>Save / Edit</button>
      </div>
      </template>
    </div>
    <div class="slds-p-vertical_medium">
      <h2 class="slds-card__header-title slds-p-horizontal_small headerFont">
        Ticket Cancellation
      </h2>
      <div class="slds-col slds-p-around--xx-small">
        <label class="slds-form-element__label fieldLabelStyle" for="eventType">Cancellation Reason<abbr class="slds-required"
          title="required">*</abbr></label>
        <lightning-combobox label="By Event Type" id="eventType" required variant="label-hidden" options={eventCancelOptions} name="Cancellation_Reason__c" value={eventRegistration.Cancellation_Reason__c} onchange={handleValueChange} dropdown-alignment="auto"
         class="cancelRequiredClass inputFieldPlaceHolder fieldLabelStyle" placeholder="Please select cancellation reason"></lightning-combobox>
      </div>
      <div class="slds-col slds-p-around--xx-small">
        <label class="slds-form-element__label fieldLabelStyle" for="description">Additional cancellation details</label>
        <lightning-input type="text" id="description"   variant="label-hidden" name="Cancellation_Description__c" value={eventRegistration.Cancellation_Description__c} onchange={handleValueChange}
                class="cancelRequiredClass inputFieldPlaceHolder fieldLabelStyle" placeholder="Please enter cancellation details"></lightning-input>
      </div>
      <div class="slds-col slds-p-around--x-small">
        <button type="button" value="Cancel Ticket"
                class="cancelButtonStyle slds-button slds-button_success slds-float_left" onclick={handleEventCancellation}>Cancel Ticket</button>
      </div>
    </div>
    </template>
    </div>
  </template>
  <!--TICKET MANAGEMENT-->

  <!--SESSION REGISTRATION-->
  <template if:true={showSessionRegistration}>
    <c-ct_-session-registration-form-v2 event-register-id={eventRegistrationId}></c-ct_-session-registration-form-v2>
  </template>
  <!--SESSION REGISTRATION-->

  <!--EVENT QR CODE-->
  <template if:true={showEventQRCode}>
    <h2 class="slds-card__header-title slds-p-around--xx-small headerFont"> 
      Check In Details
    </h2>

      <div class="slds-p-around--xx-small fieldLabelStyle">
        Please have the QR code below ready to scan when you arrive at the event.
    </div>
    <div class="slds-p-around--xx-small fieldLabelStyle">
      We use QR codes to check you into the event and at some sessions to speed up your entry process.
    </div>
    <div class="slds-p-around--xx-small">
      <canvas class="QRSelector" data-id="QRCode" lwc:dom="manual"></canvas>
      <!-- <img src={eventRegistration.QR_Code__c} alt="QR Code"></img> -->
       <lightning-formatted-rich-text value={eventRegistration.QR_Code__c}></lightning-formatted-rich-text>
      <!-- <lightning-formatted-rich-text value={eventRegistration.QR_Code__c}></lightning-formatted-rich-text> -->
    </div>
  </template>
  <!--EVENT QR CODE-->
  </template>
</div>

    <template if:false={showBackButton}>
      <div class="slds-col slds-p-around--x-small">
              <button type="button" value="Back Ticket"
                      class="cancelButtonStyle slds-button slds-button_success slds-float_left" onclick={handleBackNavigation}>Back</button>
            </div>
    </template>

</div>


 
</template>
