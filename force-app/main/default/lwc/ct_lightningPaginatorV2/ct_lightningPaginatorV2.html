<template>
  <div class={gridStyle}>
     
      <!-- <div class="slds-col">
          <div if:true={showSearchBox}>
              <div class="slds-p-horizontal_x-small slds-p-bottom_xx-small">
                  <lightning-input label="" type="search" placeholder="Search by any Col Value" variant="label-hidden" onchange={handleKeyChange}></lightning-input>
              </div>
          </div>
      </div> -->
      <div class={paginationButtonStyle}><!--PAGE NAVIGATION-->
          <div style={controlPagination} class="slds-float_left">
              <div class="slds-col slds-p-bottom_xx-small fieldLabelStyle">
                  <!-- <span style={controlPrevious}>
                      <lightning-button-icon icon-name="utility:left" variant="bare" size="medium" alternative-text="Previous Page" onclick={previousPage}></lightning-button-icon>
                  </span>
                  <label class="slds-text-color_weak slds-p-horizontal_x-small fieldLabelStyle" for="pageNum">Page:</label> 
                  <input type="number" id="pageNum" value={pageNumber} maxlength="4" onkeypress={handlePageNumberChange} class="customInput fieldLabelStyle" title="Go to a Page"></input>
                  <span>&nbsp;of&nbsp;<b id="totalPages">{totalPages}</b></span>
                  <span style={controlNext}>
                      <lightning-button-icon icon-name="utility:right" variant="bare" size="medium" alternative-text="Next Page" onclick={nextPage} class="slds-p-horizontal_x-small"></lightning-button-icon>
                  </span> -->

                <div class="slds-grid" style="flex-direction: row !important;">
                <!-- Previous Button -->
                <span key={pageNumber} style={controlPrevious}>
                    <div class="slds-col slds-align_absolute-center arrowStyle">
                        <a onclick={previousPage}>
                        <svg viewBox="0 0 60 60" class="slds-align_absolute-center">
                        <path d="M16.2,25c0-0.4,0.1-0.8,0.4-1.1l11.7-11.7c0.6-0.6,1.5-0.6,2.1,0c0.6,0.6,0.6,1.5,0,2.1L19.9,25l10.7,10.7
                        c0.6,0.6,0.6,1.5,0,2.1c-0.6,0.6-1.5,0.6-2.1,0L16.7,26.1C16.4,25.8,16.2,25.4,16.2,25z"></path>
                        </svg></a>
                    </div>
                </span>
                <template for:each={pageList} for:item="pageNumber">
                     <!-- Number Of Pages -->
                    <a key={pageNumber}> 
                       <div class="slds-col slds-align_absolute-center pageStyle">
                          <button id={pageNumber} name={pageNumber} class='slds-button slds-align_absolute-center licolor activebutton' value={pageNumber} onclick={handlePageNumberChange}>{pageNumber}</button>
                        </div>
                    </a>
               </template>
                    <!-- Next button -->
                <span key={pageNumber} style={controlNext}>
                    <div class="slds-col slds-align_absolute-center arrowStyle">
                        <a onclick={nextPage}>
                        <svg viewBox="0 0 60 60" class="slds-align_absolute-center">
                        <path d="M35,25c0,0.4-0.1,0.8-0.4,1.1L22.8,37.8c-0.6,0.6-1.5,0.6-2.1,0c-0.6-0.6-0.6-1.5,0-2.1L31.4,25L20.7,14.3
                         c-0.6-0.6-0.6-1.5,0-2.1c0.6-0.6,1.5-0.6,2.1,0l11.7,11.7C34.9,24.2,35,24.6,35,25z"></path>
                        </svg></a>
                    </div>
                </span>
               </div>
                <!-- <template for:each={totalPages} for:item="pagenumber">
                    <div key={pagenumber} style="background-color: #621360;width: 40px; height: 40px;padding:5px">
                        <a onclick={moveToLeft}>
                            {pageNumber}
                        </a>
                    </div>
                </template> -->
              </div>
          </div>
      </div>
      <div class={resultPerPageStyle}><!--RECORDS PER PAGE-->
        <div style={controlPagination} class="slds-grid direction slds-list_inline slds-p-bottom_xx-small customSelect">
            <div class="slds-col slds-align_absolute-center">
                <label class="slds-text-color_weak slds-p-horizontal_x-small fieldLabelStyle" for="recordsPerPage">Results per page:</label> 
            </div>
            <div class="slds-col slds-select_container slds-align_absolute-center boxStyle">
                <select class="slds-select fieldLabelStyle" id="recordsPerPage" onchange={handleRecordsPerPage}>
                    <template for:each={pageSizeOptions} for:item="option">
                        <option key={option} value={option}>{option}</option>
                    </template>
                </select>
            </div>
        </div>
    </div>
  </div>
</template>
