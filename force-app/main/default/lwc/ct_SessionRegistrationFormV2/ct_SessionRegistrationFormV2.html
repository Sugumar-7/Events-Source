                    <template if:true={isSessions}>

                                <a class="slds-tabs_scoped__link fieldLabelStyle" href="javascript:void(0);" role="tab" tabindex="-1" aria-selected="false" aria-controls="tab-scoped-1" data-id="mySessions" id="mySessions">My Sessions</a>
                              </li>
                              <!--DO NOT ALTER BELOW TAG DATA-ID-->
                              <li class="slds-tabs_scoped__item allTab" title="All" data-id="allSessions" onclick={handleTabState} role="presentation">
                                <a class="slds-tabs_scoped__link fieldLabelStyle" href="javascript:void(0);" role="tab" tabindex="-1" aria-selected="false" aria-controls="tab-scoped-1" data-id="allSessions" id="allSessions">All</a>
                              </li>

                                <template for:each={trackRecords} for:item="track">
                                  <li key={track.Id} class="slds-tabs_scoped__item" data-id={track.Id} onclick={handleTabState} title={track.Name} role="presentation">
                                    <a class="slds-tabs_scoped__link fieldLabelStyle" href="javascript:void(0);" role="tab" tabindex="-1" aria-selected="false" aria-controls="tab-scoped-1" data-id={track.Id} id={track.Id}>{track.Name}</a>
                                  </li>
                                </template>
                              </template>

                                            <a  href="javascript:void(0);" role="menuitem" title={track.Name}  data-id={track.Id} id={track.Id}>{track.Name}</a>
                                          </li>
                                        </template>
                                      </ul>
                                    </div>
                                  </template>
                                  </div>
                                </li>
                              </template>
