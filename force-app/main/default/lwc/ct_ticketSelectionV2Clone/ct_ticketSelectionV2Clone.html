<template>

  <template if:true={spinnerBoolean}>
    <div class="slds-spinner_container">
        <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
    </div>
  </template>

  <div class="slds-hide" data-id="QRCard">
    <canvas data-id="QRCode" lwc:dom="manual"></canvas>
</div>

  <div data-id="topElement" id="topElem" class="topElement"></div>
    <template if:true={selectedEvent}>
      
      <template if:false={isInternalComponent}>
        <c-ct_event-tile-v2 event-detail={selectedEvent} single-event=true></c-ct_event-tile-v2>
        <div class=" slds-p-vertical--xx-small"></div>
      </template>
       
        <template if:true={showTicketPanel}>
          <!-- <template if:false={isInternalComponent}> -->
        <h2 class="slds-card__header-title slds-p-bottom_x-small headingStyle">
          Event tickets ({selectedEvent.Event_Registrations_Available__c} remaining)
        </h2>
       
          <!-- </template> -->
          <template if:true={eventTickets}>
            
            <template for:each={eventTickets} for:item="eachTicket">
              <div class="slds-p-vertical_x-small" key={eachTicket.ticketNumber}>
                <c-ct_ticket-tile-v2 selected-tickets-from-ticket-selection={selectedTickets} onticketselection={handleTicketSelection} selected-event={selectedEvent} is-internal-component={isInternalComponent} event-ticket={eachTicket} key={eachTicket.Id} set-back-values={setBackRedirectionValues}></c-ct_ticket-tile-v2>
              </div>
            </template>
            <c-ct_ticket-order-form-v2-clone event-id={selectedEventId} selected-event={selectedEvent} ordered-by={orderBy} is-internal-component={isInternalComponent} selected-tickets={selectedTickets} set-back-values={setBackRedirectionValues}></c-ct_ticket-order-form-v2-clone>

            <h2 class="slds-p-top_medium slds-card__header-title headingStyle">{consentCaptureTitle}</h2>

            <div class="slds-p-vertical_small fieldLabelStyle">
              <lightning-formatted-rich-text value={consentCaptureStatementTextAboveDec}></lightning-formatted-rich-text>
            </div>

            <!-- <div class="slds-p-vertical_small fieldLabelStyle">
              <lightning-formatted-rich-text value={consentCaptureDeclarationtext}></lightning-formatted-rich-text><span><abbr class="slds-required" title="required">*</abbr></span>
              <lightning-input type="checkbox" variant="label-hidden" id="agreeToConsent" name="agreeToConsent" onchange={handleAgreerToConsent}></lightning-input>
            </div> -->

            <div class="slds-p-vertical_small fieldLabelStyle">
              <div class="slds-grid slds-grid_vertical-align-center">
                  <div class="slds-col slds-grow-none">
                      <lightning-input 
                          type="checkbox" 
                          variant="label-hidden" 
                          id="agreeToConsent" 
                          name="agreeToConsent" 
                          onchange={handleAgreerToConsent}>
                      </lightning-input>
                  </div>

                  <div class="slds-col slds-m-left_xxx-small">
                      <lightning-formatted-rich-text value={consentCaptureDeclarationtext}>
                      </lightning-formatted-rich-text>
                      <span><abbr class="slds-required" title="required">*</abbr></span>
                  </div>

              </div>
          </div>

            <div class="fieldLabelStyle">
              <template if:true={showConsentError}>
                <div class="slds-has-error" id="lastError">
                  <label class="slds-form-element__help">{consentErrorMessage}</label>
                </div>
              </template>
            </div>

            <div class="slds-p-vertical_small fieldLabelStyle">
              <lightning-formatted-rich-text value={consentCaptureStatementTextBelowDec}></lightning-formatted-rich-text>
            </div>

            <!-- ------------------Individual Attendee---------------------------- -->
          <div class="slds-p-vertical_small fieldLabelStyle">
             <p>GROUP BOOKING - For Group Bookings please feel free to leave the checkbox below empty, There is no need to provide full attendee details.</p>            
            <lightning-input class="slds-m-top_small" type="checkbox" label="I want to provide attendee details for each ticket holders." id="provideAttendeeDetails" name="provideAttendeeDetails" onchange={handleprovideAttendeeDetails} ></lightning-input>
          </div>
          </template>
          <!-- <template if:false={isInternalComponent}> -->
          <div class="slds-col slds-p-top--medium">
            <!-- <div class="slds-align_absolute-center"> -->
              <template if:true={isCheckInManagerComponent}>
                <button type="button" value="Cancel" style="border-radius: 0px;"
                    class="checkoutButton slds-p-right_x-small  slds-button slds-button_success" onclick={handleInternalRegistrationCancel}>Cancel</button>
                <span class="slds-m-left_x-small"></span>
              </template>
              <template if:true={showTicketCountMessage}>
                <label class="slds-p-bottom--medium fieldLabelStyle" style="color: red;">This event is close to capacity. There are only {selectedEvent.Event_Registrations_Available__c} Event Registrations Available</label><br/>
              </template>
              <button type="button"  title="Back" onclick={redirectToSearchEvents}
              class="checkoutButton slds-p-right_x-small  slds-button slds-button_success" style="border-radius: 0px;">Back</button>
              <button type="button"  title="Next" onclick={redirectToOrderDetails}
              class="checkoutButton slds-p-right_x-small  slds-button slds-button_success" style="border-radius: 0px;">Checkout</button>
              
          <!-- </div> -->
        </div>
        </template>
        <template if:true={showTicketsClosed}>
          <h2 class="registrationCloseMessageStyle slds-p-vertical--xx-small">{ticketsCloseMessage}</h2>
          <div class="slds-col slds-p-top--medium">
          <button type="button"  title="Back" onclick={redirectToSearchEvents}
              class="checkoutButton slds-p-right_x-small  slds-button slds-button_success" style="border-radius: 0px;">Back</button>
          </div>
        </template>
        <template if:true={showWaitingLisBtn}>
          <div>
            <c-ct_waiting-list-page-v2 event-id={selectedEventId}></c-ct_waiting-list-page-v2>
          </div>
        </template>
</template>

</template>
